<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guía de Estudio — Sesión 2: Técnicas de Elicitación</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0F172A;font-family:'Crimson Pro',Georgia,serif;color:#E2E8F0}
    button{cursor:pointer;border:none;font-family:'Crimson Pro',Georgia,serif}
    ::selection{background:#3B82F6;color:#fff}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
    .fade-up{animation:fadeUp 0.4s ease-out both}
    .mono{font-family:'JetBrains Mono',monospace}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
  const {useState,useEffect} = React;

  const techniques = [
    {
      id:"entrevistas",
      name:"Entrevistas",
      icon:"🎙️",
      color:"#3B82F6",
      definition:"Conversación estructurada o semi-estructurada entre el analista y los stakeholders para descubrir requisitos, necesidades y expectativas del sistema.",
      types:[
        {name:"Estructurada", desc:"Preguntas predefinidas, orden fijo. Ideal para recopilar datos cuantitativos y comparables entre stakeholders."},
        {name:"Semi-estructurada", desc:"Guión base flexible, permite explorar temas emergentes. La más usada en ingeniería de requisitos."},
        {name:"No estructurada (abierta)", desc:"Sin guión fijo, conversación libre. Útil en etapas iniciales de exploración del dominio."},
      ],
      advantages:["Permite profundizar en respuestas y aclarar dudas en tiempo real","Se adapta al contexto del entrevistado","Captura requisitos implícitos a través del lenguaje no verbal","Genera confianza y rapport con los stakeholders"],
      disadvantages:["Consume mucho tiempo (preparación + ejecución + análisis)","Depende de la habilidad del entrevistador","Puede generar información sesgada si las preguntas no son neutrales","Difícil de escalar a muchos stakeholders"],
      whenToUse:"Cuando necesitas entender a profundidad las necesidades de stakeholders clave, especialmente en etapas tempranas del proyecto.",
      egelTip:"El EGEL pregunta frecuentemente la diferencia entre entrevistas estructuradas vs semi-estructuradas. Recuerda: semi-estructurada = la más común en requisitos.",
      keyTerms:["Stakeholder","Rapport","Preguntas abiertas vs cerradas","Protocolo de entrevista"],
    },
    {
      id:"observacion",
      name:"Observación",
      icon:"👁️",
      color:"#8B5CF6",
      definition:"El analista observa directamente cómo los usuarios realizan sus tareas en su entorno real de trabajo, sin intervenir (pasiva) o participando (activa/etnográfica).",
      types:[
        {name:"Pasiva (directa)", desc:"El analista solo observa sin interactuar. Captura el flujo real de trabajo sin alterarlo."},
        {name:"Activa (participante)", desc:"El analista se involucra en las actividades. Permite entender el contexto desde adentro."},
        {name:"Etnográfica", desc:"Inmersión prolongada en el ambiente. Descubre requisitos culturales y sociales profundos."},
      ],
      advantages:["Descubre requisitos tácitos que los usuarios no verbalizan","Captura el contexto real de uso del sistema","Identifica problemas y workarounds que el usuario da por sentado","No depende de la capacidad de articulación del usuario"],
      disadvantages:["El observador puede alterar el comportamiento (efecto Hawthorne)","Requiere mucho tiempo de inmersión","Puede ser intrusiva para los usuarios","Difícil documentar todo lo observado en tiempo real"],
      whenToUse:"Cuando los usuarios no pueden explicar bien sus procesos, cuando hay procesos complejos o cuando sospechas que hay requisitos ocultos.",
      egelTip:"Clave: la observación captura requisitos TÁCITOS (no expresados). El efecto Hawthorne es un concepto frecuente en el examen.",
      keyTerms:["Requisitos tácitos","Efecto Hawthorne","Etnografía","Workaround","Conocimiento tácito"],
    },
    {
      id:"encuestas",
      name:"Encuestas / Cuestionarios",
      icon:"📋",
      color:"#10B981",
      definition:"Instrumento escrito con preguntas estandarizadas que se distribuye a un grupo amplio de stakeholders para recopilar información cuantitativa y cualitativa.",
      types:[
        {name:"Preguntas cerradas", desc:"Opciones predefinidas (sí/no, escala Likert, opción múltiple). Fáciles de analizar estadísticamente."},
        {name:"Preguntas abiertas", desc:"Respuesta libre. Capturan opiniones detalladas pero son más difíciles de procesar."},
        {name:"Mixtas", desc:"Combinan ambos tipos. Las más efectivas para requisitos de software."},
      ],
      advantages:["Escalan a muchos stakeholders simultáneamente","Resultados cuantificables y comparables","Bajo costo relativo","Anonimato favorece respuestas honestas","Fáciles de distribuir (en línea)"],
      disadvantages:["No permiten profundizar ni aclarar respuestas","Tasa de respuesta puede ser baja","Preguntas mal diseñadas generan datos inútiles","No capturan requisitos implícitos","No hay interacción directa con el usuario"],
      whenToUse:"Cuando tienes muchos stakeholders distribuidos geográficamente y necesitas datos cuantitativos para priorizar requisitos.",
      egelTip:"El EGEL puede preguntar cuándo usar encuestas vs entrevistas. Clave: encuestas = muchos usuarios + datos cuantitativos. Entrevistas = pocos usuarios + profundidad.",
      keyTerms:["Escala Likert","Tasa de respuesta","Muestra representativa","Sesgo de respuesta"],
    },
    {
      id:"talleres",
      name:"Talleres / Workshops (JAD)",
      icon:"🏛️",
      color:"#F59E0B",
      definition:"Reuniones grupales facilitadas donde múltiples stakeholders colaboran para identificar, discutir y negociar requisitos simultáneamente. JAD = Joint Application Development.",
      types:[
        {name:"JAD (Joint Application Development)", desc:"Sesiones estructuradas con roles definidos: facilitador, escribano, participantes. Muy formal."},
        {name:"Brainstorming", desc:"Generación libre de ideas sin juicio. Se evalúan después. Ideal para requisitos innovadores."},
        {name:"Focus Group", desc:"Grupo representativo discute temas específicos. El facilitador guía la conversación."},
      ],
      advantages:["Múltiples perspectivas en una sola sesión","Resuelve conflictos entre stakeholders en tiempo real","Genera consenso más rápido","Fomenta la creatividad y participación colectiva"],
      disadvantages:["Requiere un facilitador experimentado","Logística compleja (coordinar agendas)","Personalidades dominantes pueden sesgar resultados","Costoso en tiempo de los participantes"],
      whenToUse:"Cuando hay múltiples stakeholders con visiones diferentes y necesitas llegar a consenso rápidamente.",
      egelTip:"JAD es un término clásico del EGEL. Recuerda sus roles: facilitador, escribano (scribe), participantes. El facilitador NO da opiniones, solo guía.",
      keyTerms:["JAD","Facilitador","Brainstorming","Consenso","Focus group"],
    },
    {
      id:"prototipos",
      name:"Prototipado",
      icon:"🖥️",
      color:"#EF4444",
      definition:"Construcción de una versión preliminar del sistema (o parte de él) para que los usuarios interactúen con ella y descubran o refinen requisitos.",
      types:[
        {name:"Baja fidelidad (Lo-Fi)", desc:"Bocetos en papel, wireframes. Rápidos y baratos. Enfocados en funcionalidad y flujo."},
        {name:"Alta fidelidad (Hi-Fi)", desc:"Prototipo interactivo digital cercano al producto final. Simula la experiencia real."},
        {name:"Desechable (throwaway)", desc:"Se construye solo para validar requisitos y luego se descarta. No se usa como base del sistema."},
        {name:"Evolutivo", desc:"El prototipo evoluciona iterativamente hasta convertirse en el sistema final."},
      ],
      advantages:["Los usuarios entienden mejor lo que se propone al verlo","Reduce malentendidos y ambigüedades","Descubre requisitos que no surgirían solo con texto","Valida la viabilidad técnica tempranamente"],
      disadvantages:["Riesgo de que el usuario crea que el sistema ya está 'listo'","Prototipos Hi-Fi son costosos de crear","Puede generar expectativas falsas de rendimiento","El enfoque puede desviarse a diseño visual en lugar de requisitos"],
      whenToUse:"Cuando los requisitos son vagos o difíciles de expresar verbalmente, o cuando es un dominio nuevo para el equipo.",
      egelTip:"Pregunta clásica: diferencia entre prototipo DESECHABLE vs EVOLUTIVO. Desechable = solo para validar, se tira. Evolutivo = se convierte en el producto.",
      keyTerms:["Wireframe","Mockup","Lo-Fi / Hi-Fi","Prototipo desechable","Prototipo evolutivo"],
    },
    {
      id:"analisis_docs",
      name:"Análisis de Documentos",
      icon:"📑",
      color:"#06B6D4",
      definition:"Revisión sistemática de documentación existente (manuales, reportes, formularios, sistemas actuales) para extraer requisitos del dominio.",
      types:[
        {name:"Documentos del negocio", desc:"Manuales de procedimientos, políticas, organigramas, reportes financieros."},
        {name:"Sistema actual", desc:"Documentación técnica del sistema existente, código fuente, esquemas de BD."},
        {name:"Normativas/regulaciones", desc:"Leyes, estándares de la industria, regulaciones que el sistema debe cumplir."},
      ],
      advantages:["No requiere tiempo de los stakeholders","Disponible desde el inicio del proyecto","Proporciona contexto del dominio y vocabulario","Identifica restricciones legales y regulatorias"],
      disadvantages:["Documentación puede estar desactualizada","No captura requisitos nuevos o futuros","Puede ser muy voluminosa","No refleja prácticas reales (solo las documentadas)"],
      whenToUse:"Al inicio del proyecto para entender el dominio, o cuando se reemplaza un sistema existente.",
      egelTip:"Complementa otras técnicas. El EGEL puede preguntar qué técnica usar PRIMERO en un proyecto nuevo → análisis de documentos es buen candidato para la fase inicial.",
      keyTerms:["Dominio del problema","Documentación existente","Ingeniería inversa","Restricciones regulatorias"],
    },
  ];

  const comparisons = [
    {criteria:"Escala (# usuarios)", entrevistas:"Bajo (1-1)", observacion:"Bajo (1-pocos)", encuestas:"Alto (muchos)", talleres:"Medio (5-15)", prototipos:"Medio", docs:"N/A"},
    {criteria:"Profundidad", entrevistas:"⬛⬛⬛ Alta", observacion:"⬛⬛⬛ Alta", encuestas:"⬛ Baja", talleres:"⬛⬛ Media-Alta", prototipos:"⬛⬛ Media", docs:"⬛⬛ Media"},
    {criteria:"Costo", entrevistas:"Alto", observacion:"Alto", encuestas:"Bajo", talleres:"Alto", prototipos:"Variable", docs:"Bajo"},
    {criteria:"Req. tácitos", entrevistas:"Algunos", observacion:"⭐ Excelente", encuestas:"No", talleres:"Algunos", prototipos:"Sí", docs:"No"},
    {criteria:"Cuantitativo", entrevistas:"No", observacion:"No", encuestas:"⭐ Excelente", talleres:"No", prototipos:"No", docs:"Parcial"},
    {criteria:"Fase ideal", entrevistas:"Inicio-Medio", observacion:"Inicio", encuestas:"Medio", talleres:"Inicio-Medio", prototipos:"Medio-Final", docs:"Inicio"},
  ];

  const quizQuestions = [
    {
      q:"¿Cuál técnica es la más adecuada para descubrir requisitos tácitos que los usuarios no pueden expresar verbalmente?",
      options:["Encuestas","Entrevistas estructuradas","Observación","Análisis de documentos"],
      correct:2,
      explanation:"La observación permite descubrir requisitos tácitos porque el analista ve directamente cómo trabajan los usuarios, incluyendo workarounds y prácticas que ellos dan por sentado y no mencionarían en una entrevista."
    },
    {
      q:"En una sesión JAD (Joint Application Development), ¿cuál es el rol del facilitador?",
      options:["Tomar notas de todos los acuerdos","Dar su opinión experta sobre los requisitos","Guiar la discusión sin emitir opiniones propias","Programar el prototipo en tiempo real"],
      correct:2,
      explanation:"El facilitador en JAD guía la sesión, mantiene el enfoque y resuelve conflictos, pero NO emite opiniones sobre los requisitos. El que toma notas es el escribano (scribe)."
    },
    {
      q:"¿Cuál es la principal ventaja de las encuestas sobre las entrevistas?",
      options:["Mayor profundidad en las respuestas","Captura de requisitos implícitos","Escalabilidad a muchos stakeholders","Mejor rapport con los usuarios"],
      correct:2,
      explanation:"Las encuestas pueden distribuirse a cientos de stakeholders simultáneamente, algo imposible con entrevistas individuales. Su fortaleza es la escala y los datos cuantitativos."
    },
    {
      q:"¿Qué tipo de prototipo se construye SOLO para validar requisitos y luego se descarta?",
      options:["Evolutivo","De alta fidelidad","Desechable (throwaway)","Wireframe"],
      correct:2,
      explanation:"El prototipo desechable (throwaway) se crea únicamente para explorar y validar requisitos. Una vez cumplido ese objetivo, se descarta y el sistema se construye desde cero con los requisitos ya clarificados."
    },
    {
      q:"El efecto Hawthorne se refiere a que:",
      options:["Los usuarios olvidan mencionar requisitos importantes","Las personas modifican su comportamiento al saberse observadas","Los prototipos crean expectativas falsas","Las encuestas tienen baja tasa de respuesta"],
      correct:1,
      explanation:"El efecto Hawthorne es un fenómeno donde las personas cambian su comportamiento simplemente por saber que están siendo observadas. Es una limitación importante de la técnica de observación."
    },
    {
      q:"¿Cuál tipo de entrevista es la MÁS utilizada en ingeniería de requisitos?",
      options:["Estructurada","No estructurada","Semi-estructurada","Grupal"],
      correct:2,
      explanation:"La entrevista semi-estructurada es la más usada porque combina un guión base (consistencia) con la flexibilidad de explorar temas que surjan durante la conversación."
    },
    {
      q:"Si tienes 200 usuarios distribuidos en 5 ciudades y necesitas priorizar funcionalidades, ¿qué técnica es más apropiada?",
      options:["Observación etnográfica","Entrevistas individuales","Encuestas con escala Likert","Talleres JAD"],
      correct:2,
      explanation:"Con 200 usuarios distribuidos geográficamente, las encuestas son la mejor opción por su escalabilidad y capacidad de generar datos cuantitativos (como escalas Likert) para priorizar."
    },
    {
      q:"¿Qué técnica de elicitación es más útil al INICIO de un proyecto para entender el dominio antes de hablar con los usuarios?",
      options:["Prototipado","Brainstorming","Análisis de documentos","Encuestas"],
      correct:2,
      explanation:"El análisis de documentos permite entender el dominio, vocabulario y restricciones existentes antes de interactuar con los stakeholders. No requiere tiempo de los usuarios y está disponible desde el día uno."
    },
    {
      q:"¿Cuál es la diferencia clave entre un prototipo de baja fidelidad y uno de alta fidelidad?",
      options:["Baja fidelidad usa código; alta fidelidad usa papel","Baja fidelidad se enfoca en flujo/funcionalidad; alta fidelidad simula la experiencia final","Baja fidelidad es evolutivo; alta fidelidad es desechable","No hay diferencia significativa"],
      correct:1,
      explanation:"Los prototipos Lo-Fi (bocetos, wireframes) se enfocan en funcionalidad y flujo de navegación. Los Hi-Fi son interactivos y se acercan a la apariencia y experiencia del producto final."
    },
    {
      q:"¿Qué técnica combina mejor con las entrevistas para obtener una visión completa de los requisitos?",
      options:["Solo más entrevistas","Observación + Análisis de documentos","Solo encuestas","Solo prototipos"],
      correct:1,
      explanation:"La combinación de observación (captura lo tácito) + análisis de documentos (captura el contexto formal) complementa las entrevistas (captura lo explícito), cubriendo los tres tipos de conocimiento."
    },
  ];

  function App(){
    const [tab,setTab]=useState("tecnicas");
    const [activeTech,setActiveTech]=useState("entrevistas");
    const [quizState,setQuizState]=useState({current:0,answers:{},showResult:false,submitted:false});

    const tech = techniques.find(t=>t.id===activeTech);

    const handleAnswer=(idx)=>{
      if(quizState.answers[quizState.current]!==undefined) return;
      setQuizState(p=>({...p,answers:{...p.answers,[p.current]:idx}}));
    };
    const nextQ=()=>setQuizState(p=>({...p,current:Math.min(p.current+1,quizQuestions.length-1)}));
    const prevQ=()=>setQuizState(p=>({...p,current:Math.max(p.current-1,0)}));
    const resetQuiz=()=>setQuizState({current:0,answers:{},showResult:false,submitted:false});
    const score=Object.entries(quizState.answers).filter(([k,v])=>v===quizQuestions[k].correct).length;
    const allAnswered=Object.keys(quizState.answers).length===quizQuestions.length;

    return (
      <div style={{minHeight:"100vh",background:"#0F172A",padding:"16px 12px"}}>
        <div style={{maxWidth:880,margin:"0 auto"}}>

          {/* Header */}
          <div style={{background:"linear-gradient(135deg,#1E293B 0%,#1E3A5F 50%,#1E293B 100%)",border:"1px solid #334155",borderRadius:16,padding:"28px 22px",marginBottom:20,position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:0,right:0,width:200,height:200,background:"radial-gradient(circle,rgba(59,130,246,0.08) 0%,transparent 70%)"}}/>
            <div style={{position:"absolute",bottom:-20,left:-20,width:150,height:150,background:"radial-gradient(circle,rgba(139,92,246,0.06) 0%,transparent 70%)"}}/>
            <div className="mono" style={{fontSize:10,letterSpacing:3,color:"#64748B",marginBottom:6}}>EGEL PLUS · ISOFT · SUBÁREA 1.2 · JUE 12 MAR</div>
            <h1 style={{fontSize:22,fontWeight:700,color:"#F1F5F9",lineHeight:1.3}}>Técnicas de Elicitación de Requisitos</h1>
            <p style={{color:"#94A3B8",fontSize:13,marginTop:6,lineHeight:1.6}}>
              Entrevistas · Observación · Encuestas · Talleres · Prototipado · Análisis documental
            </p>
            <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
              {[["6","Técnicas"],["10","Reactivos quiz"],["9","React. EGEL"]].map(([n,l])=>(
                <div key={l} style={{background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:8,padding:"5px 12px",textAlign:"center"}}>
                  <div style={{fontSize:16,fontWeight:700,color:"#93C5FD"}}>{n}</div>
                  <div style={{fontSize:10,color:"#64748B"}}>{l}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Tabs */}
          <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
            {[["tecnicas","📖 Técnicas"],["comparar","⚖️ Comparativa"],["quiz","🧪 Quiz (10)"],["resumen","📝 Resumen rápido"]].map(([k,l])=>(
              <button key={k} onClick={()=>setTab(k)} style={{
                padding:"9px 16px",borderRadius:9,fontSize:13,fontWeight:tab===k?700:400,
                background:tab===k?"#3B82F6":"#1E293B",color:tab===k?"#fff":"#94A3B8",
                border:tab===k?"none":"1px solid #334155",
                transition:"all 0.2s"
              }}>{l}</button>
            ))}
          </div>

          {/* TÉCNICAS TAB */}
          {tab==="tecnicas" && (
            <div className="fade-up">
              <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
                {techniques.map(t=>(
                  <button key={t.id} onClick={()=>setActiveTech(t.id)} style={{
                    padding:"7px 13px",borderRadius:20,fontSize:12,
                    background:activeTech===t.id?t.color:"#1E293B",
                    color:activeTech===t.id?"#fff":"#94A3B8",
                    border:`1px solid ${activeTech===t.id?t.color:"#334155"}`,
                    transition:"all 0.2s"
                  }}>{t.icon} {t.name}</button>
                ))}
              </div>

              <div style={{background:"#1E293B",border:"1px solid #334155",borderRadius:14,overflow:"hidden"}}>
                <div style={{background:`linear-gradient(135deg,${tech.color}15,${tech.color}08)`,borderBottom:`1px solid ${tech.color}30`,padding:"20px 22px"}}>
                  <div style={{fontSize:28,marginBottom:6}}>{tech.icon}</div>
                  <h2 style={{fontSize:20,fontWeight:700,color:"#F1F5F9"}}>{tech.name}</h2>
                  <p style={{color:"#CBD5E1",fontSize:14,marginTop:8,lineHeight:1.7}}>{tech.definition}</p>
                </div>

                <div style={{padding:"20px 22px"}}>
                  {/* Tipos */}
                  <div style={{marginBottom:20}}>
                    <div className="mono" style={{fontSize:10,letterSpacing:2,color:tech.color,marginBottom:10,fontWeight:600}}>TIPOS</div>
                    <div style={{display:"grid",gap:8}}>
                      {tech.types.map((t,i)=>(
                        <div key={i} style={{background:"#0F172A",border:"1px solid #334155",borderRadius:10,padding:"12px 14px",borderLeft:`3px solid ${tech.color}`}}>
                          <div style={{fontWeight:700,fontSize:14,color:"#E2E8F0",marginBottom:3}}>{t.name}</div>
                          <div style={{fontSize:13,color:"#94A3B8",lineHeight:1.6}}>{t.desc}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Ventajas / Desventajas */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
                    <div>
                      <div className="mono" style={{fontSize:10,letterSpacing:2,color:"#4ADE80",marginBottom:8,fontWeight:600}}>✓ VENTAJAS</div>
                      {tech.advantages.map((a,i)=>(
                        <div key={i} style={{fontSize:13,color:"#CBD5E1",padding:"5px 0",borderBottom:"1px solid #1E293B",lineHeight:1.5}}>
                          <span style={{color:"#4ADE80",marginRight:6}}>+</span>{a}
                        </div>
                      ))}
                    </div>
                    <div>
                      <div className="mono" style={{fontSize:10,letterSpacing:2,color:"#F87171",marginBottom:8,fontWeight:600}}>✗ DESVENTAJAS</div>
                      {tech.disadvantages.map((d,i)=>(
                        <div key={i} style={{fontSize:13,color:"#CBD5E1",padding:"5px 0",borderBottom:"1px solid #1E293B",lineHeight:1.5}}>
                          <span style={{color:"#F87171",marginRight:6}}>−</span>{d}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Cuándo usar */}
                  <div style={{background:"#0F172A",border:"1px solid #334155",borderRadius:10,padding:"14px 16px",marginBottom:14}}>
                    <div className="mono" style={{fontSize:10,letterSpacing:2,color:"#FBBF24",marginBottom:6,fontWeight:600}}>¿CUÁNDO USAR?</div>
                    <div style={{fontSize:14,color:"#E2E8F0",lineHeight:1.7}}>{tech.whenToUse}</div>
                  </div>

                  {/* EGEL Tip */}
                  <div style={{background:`${tech.color}10`,border:`1px solid ${tech.color}30`,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
                    <div className="mono" style={{fontSize:10,letterSpacing:2,color:tech.color,marginBottom:6,fontWeight:600}}>🎯 TIP PARA EL EGEL</div>
                    <div style={{fontSize:14,color:"#E2E8F0",lineHeight:1.7}}>{tech.egelTip}</div>
                  </div>

                  {/* Términos clave */}
                  <div>
                    <div className="mono" style={{fontSize:10,letterSpacing:2,color:"#64748B",marginBottom:8,fontWeight:600}}>TÉRMINOS CLAVE</div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {tech.keyTerms.map((t,i)=>(
                        <span key={i} style={{background:"#0F172A",border:"1px solid #334155",borderRadius:20,padding:"4px 12px",fontSize:12,color:"#94A3B8"}}>{t}</span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* COMPARATIVA TAB */}
          {tab==="comparar" && (
            <div className="fade-up" style={{background:"#1E293B",border:"1px solid #334155",borderRadius:14,overflow:"hidden"}}>
              <div style={{padding:"16px 20px",borderBottom:"1px solid #334155"}}>
                <h2 style={{fontSize:17,fontWeight:700,color:"#F1F5F9"}}>⚖️ Tabla Comparativa de Técnicas</h2>
                <p style={{fontSize:12,color:"#64748B",marginTop:4}}>Referencia rápida para decidir qué técnica usar según el contexto</p>
              </div>
              <div style={{overflowX:"auto",padding:"0 0 8px"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                  <thead>
                    <tr style={{background:"#0F172A"}}>
                      <th style={{padding:"10px 14px",textAlign:"left",color:"#64748B",fontWeight:600,fontSize:11,letterSpacing:1,borderBottom:"1px solid #334155"}}>Criterio</th>
                      {["🎙️ Entrev.","👁️ Observ.","📋 Encuest.","🏛️ Talleres","🖥️ Prototipos","📑 Docs"].map(h=>(
                        <th key={h} style={{padding:"10px 8px",textAlign:"center",color:"#94A3B8",fontWeight:600,fontSize:11,borderBottom:"1px solid #334155",whiteSpace:"nowrap"}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {comparisons.map((row,i)=>(
                      <tr key={i} style={{background:i%2===0?"#1E293B":"#1a2536"}}>
                        <td style={{padding:"10px 14px",color:"#E2E8F0",fontWeight:600,borderBottom:"1px solid #262f3d",fontSize:12}}>{row.criteria}</td>
                        {["entrevistas","observacion","encuestas","talleres","prototipos","docs"].map(k=>(
                          <td key={k} style={{padding:"10px 8px",textAlign:"center",color:"#CBD5E1",borderBottom:"1px solid #262f3d",fontSize:12}}>{row[k]}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{padding:"14px 20px",borderTop:"1px solid #334155",background:"#162032"}}>
                <div className="mono" style={{fontSize:10,letterSpacing:2,color:"#3B82F6",marginBottom:8,fontWeight:600}}>🎯 REGLA DE ORO PARA EL EGEL</div>
                <div style={{fontSize:13,color:"#CBD5E1",lineHeight:1.7}}>
                  Nunca uses una sola técnica. En el examen, si preguntan la "mejor" combinación, generalmente la respuesta incluye al menos dos técnicas complementarias. La combinación más citada en la bibliografía es: <strong style={{color:"#93C5FD"}}>Entrevistas + Observación + Análisis de documentos</strong> para la fase inicial, seguido de <strong style={{color:"#93C5FD"}}>Prototipos + Talleres</strong> para validación.
                </div>
              </div>
            </div>
          )}

          {/* QUIZ TAB */}
          {tab==="quiz" && (
            <div className="fade-up">
              {!quizState.showResult ? (
                <div style={{background:"#1E293B",border:"1px solid #334155",borderRadius:14,overflow:"hidden"}}>
                  <div style={{padding:"16px 20px",borderBottom:"1px solid #334155",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <h2 style={{fontSize:17,fontWeight:700,color:"#F1F5F9"}}>🧪 Quiz — Técnicas de Elicitación</h2>
                      <p style={{fontSize:12,color:"#64748B",marginTop:3}}>Pregunta {quizState.current+1} de {quizQuestions.length}</p>
                    </div>
                    <div style={{display:"flex",gap:4}}>
                      {quizQuestions.map((_,i)=>{
                        const a=quizState.answers[i];
                        const c=a===undefined?"#334155":a===quizQuestions[i].correct?"#4ADE80":"#F87171";
                        return <div key={i} style={{width:10,height:10,borderRadius:"50%",background:i===quizState.current?c=="#334155"?"#3B82F6":c:c,border:i===quizState.current?"2px solid #93C5FD":"none",transition:"all 0.2s"}}/>;
                      })}
                    </div>
                  </div>

                  <div style={{padding:"22px 20px"}}>
                    <div style={{fontSize:16,fontWeight:600,color:"#F1F5F9",lineHeight:1.6,marginBottom:18}}>
                      {quizQuestions[quizState.current].q}
                    </div>

                    <div style={{display:"grid",gap:8}}>
                      {quizQuestions[quizState.current].options.map((opt,i)=>{
                        const answered=quizState.answers[quizState.current]!==undefined;
                        const isSelected=quizState.answers[quizState.current]===i;
                        const isCorrect=i===quizQuestions[quizState.current].correct;
                        let bg="#0F172A",border="#334155",col="#CBD5E1";
                        if(answered){
                          if(isCorrect){bg="#4ADE8015";border="#4ADE80";col="#4ADE80";}
                          else if(isSelected&&!isCorrect){bg="#F8717115";border="#F87171";col="#F87171";}
                        } else if(isSelected){bg="#3B82F615";border="#3B82F6";col="#93C5FD";}
                        return (
                          <button key={i} onClick={()=>handleAnswer(i)} style={{
                            background:bg,border:`1px solid ${border}`,borderRadius:10,padding:"12px 16px",
                            textAlign:"left",fontSize:14,color:col,transition:"all 0.2s",
                            cursor:answered?"default":"pointer"
                          }}>
                            <span style={{fontWeight:600,marginRight:8,opacity:0.6}}>{String.fromCharCode(65+i)}.</span>
                            {opt}
                            {answered&&isCorrect&&<span style={{float:"right"}}>✓</span>}
                            {answered&&isSelected&&!isCorrect&&<span style={{float:"right"}}>✗</span>}
                          </button>
                        );
                      })}
                    </div>

                    {quizState.answers[quizState.current]!==undefined && (
                      <div style={{marginTop:14,background:"#162032",border:"1px solid #1E3A5F",borderRadius:10,padding:"14px 16px",animation:"fadeUp 0.3s ease-out"}}>
                        <div className="mono" style={{fontSize:10,letterSpacing:2,color:"#93C5FD",marginBottom:5,fontWeight:600}}>EXPLICACIÓN</div>
                        <div style={{fontSize:13,color:"#CBD5E1",lineHeight:1.7}}>{quizQuestions[quizState.current].explanation}</div>
                      </div>
                    )}
                  </div>

                  <div style={{padding:"12px 20px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:"1px solid #334155"}}>
                    <button onClick={prevQ} disabled={quizState.current===0} style={{padding:"8px 16px",borderRadius:8,fontSize:13,background:"#0F172A",color:quizState.current===0?"#334155":"#94A3B8",border:"1px solid #334155"}}>← Anterior</button>
                    <div>
                      {allAnswered && !quizState.showResult && (
                        <button onClick={()=>setQuizState(p=>({...p,showResult:true}))} style={{padding:"8px 20px",borderRadius:8,fontSize:13,fontWeight:700,background:"#3B82F6",color:"#fff",marginRight:8}}>Ver resultado</button>
                      )}
                    </div>
                    <button onClick={nextQ} disabled={quizState.current===quizQuestions.length-1} style={{padding:"8px 16px",borderRadius:8,fontSize:13,background:"#0F172A",color:quizState.current===quizQuestions.length-1?"#334155":"#94A3B8",border:"1px solid #334155"}}>Siguiente →</button>
                  </div>
                </div>
              ) : (
                <div style={{background:"#1E293B",border:"1px solid #334155",borderRadius:14,padding:"28px 22px",textAlign:"center"}}>
                  <div style={{fontSize:48,marginBottom:10}}>{score>=8?"🏆":score>=6?"👍":"📖"}</div>
                  <h2 style={{fontSize:22,fontWeight:700,color:"#F1F5F9"}}>{score} / {quizQuestions.length}</h2>
                  <p style={{color:"#94A3B8",fontSize:14,marginTop:6}}>
                    {score>=8?"¡Excelente! Dominas las técnicas de elicitación.":score>=6?"Buen nivel. Revisa las que fallaste.":"Necesitas repasar. Revisa las fichas de cada técnica."}
                  </p>
                  <div style={{marginTop:16,display:"grid",gap:6}}>
                    {quizQuestions.map((q,i)=>{
                      const correct=quizState.answers[i]===q.correct;
                      return (
                        <div key={i} style={{background:"#0F172A",border:`1px solid ${correct?"#4ADE8030":"#F8717130"}`,borderRadius:8,padding:"8px 14px",textAlign:"left",display:"flex",gap:8,alignItems:"center"}}>
                          <span style={{fontSize:16}}>{correct?"✅":"❌"}</span>
                          <span style={{fontSize:12,color:"#CBD5E1",flex:1}}>{q.q.substring(0,80)}...</span>
                          {!correct && <span style={{fontSize:11,color:"#4ADE80",whiteSpace:"nowrap"}}>R: {q.options[q.correct].substring(0,25)}</span>}
                        </div>
                      );
                    })}
                  </div>
                  <button onClick={resetQuiz} style={{marginTop:18,padding:"10px 24px",borderRadius:9,fontSize:14,fontWeight:700,background:"#3B82F6",color:"#fff"}}>Reintentar quiz</button>
                </div>
              )}
            </div>
          )}

          {/* RESUMEN TAB */}
          {tab==="resumen" && (
            <div className="fade-up" style={{display:"grid",gap:12}}>
              <div style={{background:"#1E293B",border:"1px solid #334155",borderRadius:14,padding:"20px"}}>
                <h2 style={{fontSize:17,fontWeight:700,color:"#F1F5F9",marginBottom:14}}>📝 Resumen Express — Lo que DEBES saber para el EGEL</h2>

                <div style={{display:"grid",gap:12}}>
                  {[
                    {title:"1. Entrevista semi-estructurada = la más usada",detail:"Combina estructura (consistencia) con flexibilidad (exploración). Es el estándar en ingeniería de requisitos."},
                    {title:"2. Observación → requisitos TÁCITOS",detail:"Es la única técnica que captura lo que los usuarios NO pueden decir. Efecto Hawthorne: cambian comportamiento al ser observados."},
                    {title:"3. Encuestas = ESCALA + datos CUANTITATIVOS",detail:"Para muchos usuarios distribuidos. Escala Likert para medir grado de acuerdo/importancia. No profundizan."},
                    {title:"4. JAD: facilitador NO opina",detail:"Joint Application Development. Roles: facilitador (guía), escribano (notas), participantes (stakeholders). El facilitador es neutral."},
                    {title:"5. Prototipo desechable vs evolutivo",detail:"Desechable: solo para validar requisitos, se tira. Evolutivo: crece hasta convertirse en el sistema final."},
                    {title:"6. Lo-Fi vs Hi-Fi",detail:"Lo-Fi: papel/wireframe, rápido, enfocado en flujo. Hi-Fi: digital interactivo, cercano al producto final, más costoso."},
                    {title:"7. Análisis de documentos = punto de partida",detail:"Primera técnica al iniciar proyecto. Entiende dominio, vocabulario, restricciones. No necesita tiempo del usuario."},
                    {title:"8. Nunca una sola técnica",detail:"Siempre combinar técnicas. Clásica: entrevistas + observación + docs (inicio) → prototipos + talleres (validación)."},
                    {title:"9. Preguntas abiertas vs cerradas",detail:"Abiertas: exploración, profundidad, difícil de analizar. Cerradas: datos cuantitativos, fácil de analizar, menos ricas."},
                    {title:"10. Brainstorming: SIN juicio",detail:"Regla fundamental: en la fase de generación no se critican ideas. La evaluación viene después. Fomenta creatividad."},
                  ].map((item,i)=>(
                    <div key={i} style={{background:"#0F172A",border:"1px solid #334155",borderRadius:10,padding:"13px 16px"}}>
                      <div style={{fontWeight:700,fontSize:14,color:"#93C5FD",marginBottom:4}}>{item.title}</div>
                      <div style={{fontSize:13,color:"#94A3B8",lineHeight:1.6}}>{item.detail}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{background:"#1E293B",border:"1px solid #F59E0B30",borderRadius:14,padding:"18px 20px"}}>
                <div className="mono" style={{fontSize:10,letterSpacing:2,color:"#F59E0B",marginBottom:8,fontWeight:600}}>📚 LECTURAS RECOMENDADAS PARA HOY</div>
                <div style={{display:"grid",gap:8}}>
                  {[
                    {name:"Wong (2017) – Cap. sobre elicitación",url:"https://repositorio.continental.edu.pe/bitstream/20.500.12394/4281/1/DO_FIN_103_MAI_UC0939_2018.pdf",note:"PDF gratuito en español · Muy alineado al EGEL"},
                    {name:"Sommerville (9a ed.) – Cap. 4: Ingeniería de requisitos",url:"https://www.pearson.com/en-us/subject-catalog/p/software-engineering/P200000003258",note:"Buscar en biblioteca · Secciones 4.5-4.6"},
                    {name:"Video: Ingeniería de Requerimientos desde cero",url:"https://www.youtube.com/watch?v=q3BYFLMCKlg",note:"YouTube gratuito · Técnicas explicadas en español"},
                  ].map((r,i)=>(
                    <a key={i} href={r.url} target="_blank" rel="noreferrer" style={{display:"block",background:"#0F172A",border:"1px solid #334155",borderRadius:8,padding:"10px 14px",color:"#93C5FD",fontWeight:600,fontSize:13,textDecoration:"none"}}>
                      {r.name} ↗
                      <div style={{fontWeight:400,fontSize:11,color:"#64748B",marginTop:2}}>{r.note}</div>
                    </a>
                  ))}
                </div>
              </div>
            </div>
          )}

          <div style={{textAlign:"center",marginTop:20,fontSize:11,color:"#475569",paddingBottom:20}}>
            EGEL Plus® ISOFT · Sesión 2 · Subárea 1.2 · Técnicas de Elicitación
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
