      icon:"🔍",
      color:"#3B82F6",
      intro:"La elicitación es el proceso de descubrir los requisitos del sistema a través de la comunicación con los stakeholders y el estudio del dominio. Sommerville (2011, Cap. 4) señala que es la etapa más crítica porque los errores aquí se propagan a todo el proyecto. Pressman (2010, Cap. 5) la define como la actividad de «comunicación» del proceso de ingeniería de requisitos.",

      techniques:[
        {
          name:"Entrevistas",
          icon:"🎙️",
          content:"**Definición:** Conversación planificada entre el analista y uno o más stakeholders para obtener información sobre necesidades, expectativas y restricciones del sistema.\n\n**Tipos según Sommerville (2011, Cap. 4.5.1):**\n• **Estructurada:** Preguntas predefinidas en orden fijo. Todas las entrevistas siguen el mismo guión. Produce datos comparables. Útil cuando ya tienes hipótesis que validar.\n• **Semi-estructurada:** Guión base con preguntas abiertas y cerradas, pero el entrevistador puede desviarse para explorar temas emergentes. Es la MÁS USADA en ingeniería de requisitos según Sommerville y Pressman.\n• **No estructurada (abierta):** Sin guión predefinido. Conversación libre guiada por temas generales. Útil al inicio cuando aún no conoces el dominio.\n\n**Tipos de preguntas según Wiegers & Beatty (2013, Cap. 7):**\n• **De contexto:** «¿Cuál es su rol en el proceso actual?»\n• **De flujo:** «¿Qué pasa después de aprobar la solicitud?»\n• **De problema:** «¿Qué es lo más frustrante del sistema actual?»\n• **Abiertas:** Generan respuestas amplias — «Descríbame su día típico»\n• **Cerradas:** Respuestas concretas — «¿Cuántas veces al día usa el módulo X?»\n\n**Buenas prácticas (Pressman, 2010, Cap. 5):**\n• Preparar la entrevista con investigación previa del dominio\n• Iniciar con preguntas de contexto antes de las detalladas\n• Evitar preguntas tendenciosas («¿No cree que sería mejor si...?»)\n• Grabar o tomar notas con consentimiento\n• Enviar resumen al entrevistado para validación posterior\n\n**Ventajas:** Profundidad, flexibilidad, captura lenguaje no verbal, genera rapport.\n**Desventajas:** No escala (uno a uno), depende del analista, consume tiempo, posible sesgo.",

          icon:"👁️",
          content:"**Definición:** El analista observa directamente cómo los usuarios realizan sus tareas en su ambiente real de trabajo. Sommerville (2011, Cap. 4.6) dedica una sección completa a la etnografía como técnica de elicitación.\n\n**Tipos:**\n• **Pasiva (directa):** El analista solo observa sin intervenir. Registra actividades, tiempos, secuencias y excepciones.\n• **Activa (participante):** El analista se involucra en las tareas. Comprende el contexto desde adentro.\n• **Etnografía (inmersión):** Según Sommerville (2011, Cap. 4.6.1), es una inmersión prolongada en el entorno de trabajo. Descubre requisitos sociales, culturales y organizacionales que otras técnicas no capturan.\n\n**Concepto clave — Requisitos tácitos:**\nSommerville enfatiza que la observación es la ÚNICA técnica eficaz para descubrir requisitos tácitos: conocimiento que los usuarios tienen pero no pueden verbalizar porque lo dan por sentado. Ejemplo: un empleado que siempre revisa un post-it antes de aprobar algo — ese «paso» no aparece en ningún manual.\n\n**Concepto clave — Efecto Hawthorne:**\nLas personas modifican su comportamiento cuando saben que están siendo observadas (Pressman, 2010). El analista puede estar viendo un flujo «artificial» en lugar del real.\n\n**Cuándo usar según Sommerville:** Cuando los requisitos están ligados al contexto organizacional; cuando los usuarios no pueden explicar sus procesos; para sistemas que reemplazan prácticas de trabajo existentes.\n\n**Ventajas:** Captura lo tácito, ve el contexto real, no depende de la articulación verbal del usuario.\n**Desventajas:** Efecto Hawthorne, consume mucho tiempo, no escala, puede ser invasiva.",

          icon:"🏛️",
          content:"**Definición:** Reuniones grupales facilitadas donde múltiples stakeholders colaboran para identificar, negociar y priorizar requisitos. Sommerville (2011, Cap. 4.5.2) y Pressman (2010, Cap. 5) los identifican como técnica para resolver conflictos.\n\n**JAD (Joint Application Development) — Wiegers & Beatty (2013, Cap. 7):**\nTiene roles específicos:\n• **Facilitador:** Guía la sesión, mantiene el enfoque, resuelve conflictos. IMPORTANTE: el facilitador NO da opiniones sobre requisitos ni toma decisiones técnicas.\n• **Escribano (Scribe):** Documenta todo en tiempo real. NO es el facilitador.\n• **Participantes:** Stakeholders (usuarios, gerentes, desarrolladores) que aportan requisitos.\n• **Observadores:** Asisten pero no participan activamente.\n\n**Brainstorming:**\nGeneración libre de ideas. Regla fundamental: durante la generación NO se critican ni evalúan ideas. La evaluación viene después en fase separada. Objetivo: cantidad sobre calidad inicial.\n\n**Focus Group:**\nGrupo representativo (6-10 personas) discuten temas específicos guiados por un moderador. Útil para entender percepciones y preferencias.\n\n**Ventajas:** Múltiples perspectivas simultáneas, resuelve conflictos en tiempo real, genera consenso.\n**Desventajas:** Logística compleja, personalidades dominantes sesgan resultados, requiere facilitador experimentado, costoso en horas-persona.",

          icon:"🖥️",
          content:"**Definición:** Versión preliminar del sistema para que los usuarios interactúen y descubran o refinen requisitos. Sommerville (2011, Cap. 2.3) y Pressman (2010, Cap. 5) lo consideran esencial cuando los requisitos son ambiguos.\n\n**Por fidelidad (Pressman, 2010):**\n• **Baja fidelidad (Lo-Fi):** Bocetos en papel, wireframes, storyboards. Rápidos y baratos. Se enfocan en flujo y funcionalidad, NO en apariencia visual.\n• **Alta fidelidad (Hi-Fi):** Prototipos digitales interactivos que simulan la experiencia real. Más costosos pero mejores para validación detallada.\n\n**Por destino (Sommerville, 2011, Cap. 2.3.1):**\n• **Desechable (throwaway):** Se construye SOLO para explorar y validar requisitos. Se DESCARTA completamente. El sistema final se construye desde cero.\n• **Evolutivo:** Se refina iterativamente y evoluciona hasta convertirse en el sistema final. Se usa en metodologías ágiles.\n\n**¿Por qué funciona?** Wiegers & Beatty (2013) explican que los usuarios tienen dificultad para imaginar un sistema abstracto. Al interactuar con un prototipo descubren lo que realmente necesitan.\n\n**Riesgo principal (Sommerville):** El usuario puede creer que el prototipo ya es el sistema terminado y presionar para liberarlo sin la ingeniería adecuada.\n\n**Ventajas:** Reduce ambigüedad, descubre requisitos ocultos, valida usabilidad tempranamente.\n**Desventajas:** Hi-Fi es costoso, expectativas falsas, puede desviar enfoque a diseño visual.",

      intro:"Una vez obtenidos los requisitos, hay que analizarlos para detectar conflictos, redundancias, ambigüedades e incompletitudes. Sommerville (2011, Cap. 4.5) describe el análisis como clasificación, modelado conceptual y negociación. El SWEBOK v3.0 (IEEE, Cap. 1.4) lo define como el proceso de descomponer y examinar los requisitos para asegurar que sean correctos, completos y consistentes.",
      introRef:"Sommerville (2011) Cap. 4.5 · SWEBOK v3.0 Cap. 1.4 · Pressman (2010) Cap. 6",
      techniques:[

          icon:"🗂️",
          content:"**Según Sommerville (2011, Cap. 4.1) y el SWEBOK v3.0:**\n\n**Por naturaleza:**\n• **Funcionales:** Qué debe HACER el sistema. Comportamiento, entradas, salidas, procesamiento. Ej: «El sistema debe permitir buscar productos por nombre».\n• **No funcionales:** Cómo debe SER el sistema. Restricciones de calidad:\n  — **De producto:** rendimiento, usabilidad, fiabilidad, portabilidad\n  — **Organizacionales:** estándares, lenguajes requeridos, metodología\n  — **Externos:** regulaciones legales, interoperabilidad\n\n**Por nivel (Wiegers & Beatty, 2013):**\n• **De negocio:** Objetivos de alto nivel. Ej: «Reducir tiempo de procesamiento en 40%».\n• **De usuario:** Lo que el usuario necesita hacer. Ej: «Generar cotizaciones en menos de 5 minutos».\n• **Del sistema:** Comportamiento detallado del software.\n\n**TRUCO PARA EL EGEL:** Si el requisito dice qué HACE el sistema = funcional. Si dice qué tan bien, rápido, seguro = no funcional.",

        {

          icon:"📊",

      intro:"No todos los requisitos tienen la misma importancia ni urgencia. La priorización determina el orden de implementación. Hatton (2008, IEEE) presenta un análisis comparativo de métodos. Wiegers & Beatty (2013, Cap. 16) dedican un capítulo completo al tema. Usman et al. (2015) aportan la perspectiva ágil.",

          content:"**Técnica que clasifica cada requisito en cuatro categorías. Según Hatton (2008), una de las más utilizadas en proyectos ágiles.**\n\n**Categorías:**\n• **Must have (Debe tener):** Indispensables. Sin estos el sistema NO funciona. Son el mínimo viable. Ej: «El e-commerce DEBE procesar pagos».\n• **Should have (Debería tener):** Importantes pero no críticos para el lanzamiento. Funciona sin ellos pero con limitaciones. Ej: «DEBERÍA enviar confirmaciones por email».\n• **Could have (Podría tener):** Deseables si hay tiempo. Mejoran experiencia pero no son esenciales. Ej: «PODRÍA tener chatbot de soporte».\n• **Won't have (No tendrá — esta vez):** Explícitamente excluidos de esta versión. Documentados para futuro. Ej: «NO TENDRÁ integración con redes sociales en v1».\n\n**PARA EL EGEL:** MoSCoW es la técnica más preguntada. «Won't have» NO significa «nunca», sino «no en esta versión». Must = típicamente ~60% del esfuerzo.",

          content:"**Según Sommerville (2011, Cap. 4.7.1):** Proceso donde un grupo de revisores examina el documento de requisitos para detectar errores.\n\n**Qué se verifica (checklist de McConnell):**\n• **Completitud:** ¿Falta algún requisito? ¿Se cubrieron todos los escenarios?\n• **Consistencia:** ¿Hay requisitos que se contradigan?\n• **No ambigüedad:** ¿Puede un requisito interpretarse de más de una manera?\n• **Verificabilidad:** ¿Se puede probar/medir que se cumple?\n• **Trazabilidad:** ¿Cada requisito tiene un origen identificable?\n• **Factibilidad:** ¿Es técnicamente posible implementarlo?\n\n**Proceso típico:**\n1. Distribución del documento a revisores (analistas, devs, testers, usuarios)\n2. Revisión individual previa a la reunión\n3. Reunión grupal para discutir hallazgos\n4. Documentación de defectos encontrados\n5. Corrección y re-revisión\n\n**PARA EL EGEL:** Revisión = técnica de validación más importante. La checklist de McConnell es referencia directa.",
